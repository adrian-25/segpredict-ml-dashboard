services:
  - type: web
    name: segpredict-ml-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /docs
    autoDeployTrigger: commit
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
