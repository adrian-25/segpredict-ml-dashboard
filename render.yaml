services:
  - type: web
    name: segpredict-ml-dashboard
    runtime: docker
    plan: free
    healthCheckPath: /docs
    autoDeployTrigger: commit
    envVars:
      - key: DEMO_MODE
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
